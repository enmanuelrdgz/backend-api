spring.application.name=surveys

# Connection to database (production)
# spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres
# spring.datasource.username=postgres.kczzmrbohhkiygmwjepl
# spring.datasource.password=11235

# Connection to database (development)
spring.datasource.url=jdbc:h2:mem:testing
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
# spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Opcional: Mostrar la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Hibernate Crear tablas automaticamente
spring.jpa.hibernate.ddl-auto=create-drop
# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

#spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=true

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.properties.hibernate.format_sql=true

#spring.jpa.show-sql=false

#spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

management.endpoints.web.exposure.include=health,info,metrics